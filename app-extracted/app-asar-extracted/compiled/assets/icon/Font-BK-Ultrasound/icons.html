<!DOCTYPE html>
<html>
<head>
	<style>
		body {
			background-color: #ececec;
		}
		.item {
			height: 90px;
			width: 90px;
			background-position: center;
			background-size: contain;
			background-repeat: no-repeat;
			color: #000;
			margin-bottom: 30px;
			margin-right: 30px;
			position: relative;
		}
	</style>
    <script type="text/javascript">
        window.onload = () => {
            for(var i = 0; i<77;i++) {
				var d = document.createElement('div');
				d.classList.toggle("item", true);
				d.style.backgroundImage = 'url("' + i + '.svg")';
				d.innerHTML ='<span style="position: absolute;bottom: -20px;">' + i + '.svg</span>';
				document.getElementById("body").appendChild(d)
			}
        };
    </script>
</head>
<body>
	<div 
	id="body"
	style="
		position: absolute;
		z-index: 999;
		background: transparent;
		top: 0;
		left: 0;
		right: 0;
		display: flex;
		flex-flow: wrap;
	">
	</div>
</body>
</html>
